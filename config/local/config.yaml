serviceName: user_service
development: true
database:
  readDb:
    connectionString: postgresql://dev:dev@127.0.0.1:5432/dev_db?sslmode=disable
    dbType: postgres
    migrationFilePath: migrations
    maxIdleConns: 100
    maxOpenConns: 200
    connMaxLifetime: 5
  writeDb:
    connectionString: postgresql://dev:dev@127.0.0.1:5432/dev_db?sslmode=disable
    dbType: postgres
    migrationFilePath: migrations
    maxIdleConns: 100
    maxOpenConns: 200
    connMaxLifetime: 5
http:
  port: :5001
  development: true
  shutdownTimeout: 15
  resources: []
  allowOrigins: [ "http://localhost:8080", "http://localhost:8081" ]
grpc:
  port: :6001
  development: true
  maxConnectionIdle: 5
  timeout: 15
  maxConnectionAge: 5
  time: 10
client:
  userService: "localhost:5002"
  driverService: "localhost:5005"
  commonService: "localhost:5008"
logger:
  level: debug
  devMode: false
  encoder: json
tracing:
  enable: false
  serviceName: order_service
  hostPort: "localhost:4317"
  logSpans: false
kafka:
  dialer:
    username:
    password:
  config:
    brokers: ["localhost:9092"]
    groupID: user-service
    initTopics: false
    numWorker: 20
  topics:
    emailVerified:
      topicName: courier.user.events.v1
      numPartitions: 3
      replicationFactor: 1
redis:
  addrs: ["localhost:6379"]
  password: ""
  db: 0
  poolSize: 100
heathcheck:
  interval: 10
  port: :7001
  goroutineThreshold: 1000
metrics:
  prometheusPath: /metrics
  prometheusPort: :8001
kakaomap:
  appRestKey: 
  mobilityApiEndpoint: 
  coord2regioncode: 
  address: 
  priority:
  timeChange:
authenticate:
  clientURI:
s3:
  path:
  reconci:
cronjob:
  disable: false
  dispatchSms: 60
  stat: "0"
  FILELOC5: ""
slackservice:
  channel: "courier-dev"
  username: "vucongthanh92"
  urlSlackWebhook: ${SLACK_SERVICE_WEBHOOK}
email:
  enabled: false
  provider: smtp
  from: "vucongthanh92@gmail.com"
  verifyUrl: "https://localhost:3000/verify-email"
  smtp:
    host: "smtp.gmail.com"
    port: 587
    username: "vucongthanh92@gmail.com"
    password: ""
loki:
  url: http://localhost:3100/loki/api/v1/push
  env: local
  service: user-service
  batchSize: 20
  flushMs: 1000
  maxQueue: 1000
  retry: 3
  timeoutMs: 2000
oauth:
  google:
    client_id: ${OAUTH_GOOGLE_CLIENT_ID}
    client_secret: ${OAUTH_GOOGLE_CLIENT_SECRET}
    redirect_uri: "http://localhost:5001/api/v1/auth/identity/google/callback"
  github:
    client_id: ${OAUTH_GITHUB_CLIENT_ID}
    client_secret: ${OAUTH_GITHUB_CLIENT_SECRET}
    api_base: "https://api.github.com"
sso:
  cookie_name: courier_sso
  cookie_domain: ""
  cookie_secure: false
  cookie_same_site: lax
  session_ttl_minutes: 43200
  code_ttl_seconds: 120
  id_token_ttl_minutes: 30
  login_url: "http://localhost:8080/login"
  clients:
    - client_id: conversa-web
      name: Conversa Web
      redirect_uris:
        - "http://localhost:8080/oauth/callback/courier"
      scopes:
        - openid
        - profile
        - email
    - client_id: flikk-web
      name: Flikk Web
      redirect_uris:
        - "http://localhost:8081/oauth/callback/courier"
      scopes:
        - openid
        - profile
        - email
